 ln("عدد الجلسات: "+my.length+"   متوسط الإتقان: "+(avg(my)==null?"—":avg(my)+"%"),30);ln("أخطاء "+E[0]+" | لحون "+E[1]+" | تنبيهات "+E[2],30);y+=20;ln("تفاصيل الجلسات",34,"#1b5640",1);

function sess(){const h=cur.k=="h";

<button style="width:100%;padding:15px" onclick="saveS()">حفظ الجلسة</button>`}

 if(!cur.res.length){cur.pick=null;b.innerHTML=`<p class="note">${has?"لا توجد آية تبدأ بهذا النص في النطاق المحدد.":"نص هذا النطاق غير محمّل — استورد المصحف من الشاشة الرئيسية."}</p>`;return}
 if(!cur.res.find(o=>o.k==cur.pick))cur.pick=cur.res[0].k;
 b.innerHTML=cur.res.map((o,j)=>{let k=0,i=0;for(;i<o.t.length&&k<q.length;i++)k+=norm(o.t[i]).length;while(i<o.t.length&&isD(o.t[i]))i++;return `<div class="m" onclick="pickV(${j})" style="border:2px solid ${o.k==cur.pick?"var(--pr)":"transparent"}"><mark>${esc(o.t.slice(0,i))}</mark><span>${esc(o.t.slice(i))}</span><small>سورة ${SN[o.s-1].n} · آية ${o.n}</small></div>`}).join("")+(cur.res.length>1?`<p class="note">اضغط على الآية الصحيحة لتُسجَّل مع الإدخال.</p>`:"")}
